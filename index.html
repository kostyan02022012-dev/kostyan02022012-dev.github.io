<!DOCTYPE html>
<html>
<head>
    <title>My Site!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #3498db;
            object-fit: cover; /* Чтобы фото не растягивалось */
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #34495e;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ВСТАВЛЯЕМ ФОТО ТУТ -->
        <img src="DIMANCHIK-PORVANIY-PUKANCHIK.jpg" alt="Моё фото" class="avatar">
        <h1>Привет! Меня зовут Дима</h1>
        <p>Я учусь создавать сайты. Это мой первый проект в интернете!</p>
    </div>
</body>
</html>
